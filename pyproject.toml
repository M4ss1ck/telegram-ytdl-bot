[project]
name = "telegram-ytdl-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "kurigram>=2.2.26",
    "tgcrypto-pyrofork>=1.2.8",
    "python-dotenv>=1.2.4",
    "yt-dlp[default,curl-cffi]>=2026.10.26",
    "browser-cookie3>=0.20.1",
    "ffmpeg-python>=0.2.0",
    "spotipy>=2.26.0",
    "gallery-dl>=1.32.18",
]

[project.scripts]
telegram-ytdl-bot = "src.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
